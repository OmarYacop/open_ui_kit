name: Publish package

# Pub.dev must be configured for repository `OmarYacop/open_ui_kit`, tag pattern
# `v{{version}}`, and required GitHub environment `pub.dev` before the first run.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: pub-dev-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate annotated tag, version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/ci release-tag "$RELEASE_TAG"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run release-level validation
        run: ./scripts/ci all

  publish:
    name: Publish to pub.dev
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      environment: pub.dev

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
